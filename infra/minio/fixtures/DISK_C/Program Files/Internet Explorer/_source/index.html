<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="./" />
    <title>Internet Explorer</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        overflow: hidden;
        height: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, sans-serif;
        font-size: 0.75rem;
        background: #c0c0c0;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .ie-root {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .ie-content {
        flex: 1;
        min-height: 0;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .ie-content img,
      .ie-content video,
      .ie-content audio {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .ie-content iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      .ie-controls {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0.5rem;
        background: #c0c0c0;
        border-top: 1px solid #808080;
      }
      .ie-btn {
        padding: 0.25rem 0.5rem;
        min-width: 1.5rem;
        border: 1px solid;
        border-color: #fff #404040 #404040 #fff;
        background: #c0c0c0;
        cursor: pointer;
        font-size: 0.75rem;
      }
      .ie-btn:disabled {
        color: #808080;
        cursor: default;
        border-color: #808080;
      }
      .ie-btn:not(:disabled):active {
        border-color: #404040 #fff #fff #404040;
      }
      .ie-status {
        flex: 1;
        padding: 0 0.5rem;
        color: #000;
      }
      .ie-error {
        color: #c00;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="ie-root" class="ie-root">
      <div class="ie-content">
        <img id="ie-img" alt="" style="display: none" />
        <video id="ie-video" controls style="display: none"></video>
        <audio id="ie-audio" controls style="display: none"></audio>
        <iframe id="ie-frame" style="display: none"></iframe>
        <div id="ie-loading" style="color: #000">Loading...</div>
        <div id="ie-error" class="ie-error" style="display: none"></div>
      </div>
      <div class="ie-controls">
        <button type="button" class="ie-btn" id="btn-prev" disabled>◀</button>
        <button type="button" class="ie-btn" id="btn-next" disabled>▶</button>
        <span class="ie-status" id="ie-status"></span>
      </div>
    </div>
    <script>
      (function () {
        if (window.parent === window) return;
        function sendReady() {
          try {
            window.parent.postMessage({ type: "APP_READY", timestamp: Date.now() }, "*");
          } catch (_) {}
        }
        sendReady();
        if (document.readyState !== "complete") {
          window.addEventListener("DOMContentLoaded", sendReady);
        }
        window.__fp4PendingOpenFile = null;
        window.addEventListener("message", function (e) {
          var d = e.data;
          if (d && d.type === "OPEN_FILE" && d.payload) {
            window.__fp4PendingOpenFile = d.payload;
          }
        });
      })();
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
