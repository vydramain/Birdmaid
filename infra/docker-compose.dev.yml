# FP1+FP2 Dev Domain — Traefik + dev-server + MinIO + Gateway
# ADR#8: Dev domain via Traefik + docker-compose
# Usage: docker compose -f infra/docker-compose.dev.yml up -d
# Prerequisite: 127.0.0.1 shell.local api.shell.local s3.shell.local in /etc/hosts

services:
  traefik:
    image: traefik:v3.6.8
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`s3.shell.local`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
      - "traefik.http.services.minio.loadbalancer.passHostHeader=true"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    volumes:
      - ./minio:/minio
    working_dir: /minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set myminio http://minio:9000 minioadmin minioadmin 2>/dev/null; do echo "Waiting for MinIO..."; sleep 2; done
        mc mb myminio/birdmaid-dev --ignore-existing
        mc cors set myminio/birdmaid-dev /minio/cors.xml
        mc cp --recursive /minio/fixtures/DISK_A/ myminio/birdmaid-dev/roots/DISK_A/ 2>/dev/null || true
        mc cp --recursive /minio/fixtures/DISK_C/ myminio/birdmaid-dev/roots/DISK_C/ 2>/dev/null || true
        mc cp --recursive /minio/fixtures/DISK_D/ myminio/birdmaid-dev/roots/DISK_D/ 2>/dev/null || true
        echo "MinIO init done."

  gateway:
    # M1: real gateway (Node + Fastify). Volume mount for dev; no Dockerfile.gateway.
    image: node:22-alpine
    working_dir: /app/back
    volumes:
      - ..:/app
    command:
      - sh
      - -c
      - corepack enable pnpm && pnpm install --no-frozen-lockfile && pnpm dev
    environment:
      CI: "true"
      PORT: "3000"
      HOST: "0.0.0.0"
      FS_S3_ENDPOINT: http://minio:9000
      FS_S3_PUBLIC_URL: http://s3.shell.local
      FS_S3_BUCKET: birdmaid-dev
      FS_S3_ACCESS_KEY: minioadmin
      FS_S3_SECRET_KEY: minioadmin
      FS_SIGNED_URL_TTL_SEC: "120"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`api.shell.local`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.services.gateway.loadbalancer.server.port=3000"

  dev-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shell.rule=Host(`shell.local`)"
      - "traefik.http.routers.shell.entrypoints=web"
      - "traefik.http.services.shell.loadbalancer.server.port=5173"
    ports:
      - "5173:5173"
    volumes:
      - ../:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_PROXY_TARGET=http://gateway:3000

volumes:
  minio_data: {}
